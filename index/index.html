const grid = document.getElementById("productGrid");
const sentinel = document.getElementById("sentinel");
const searchInput = document.getElementById("searchInput");
const featuredGrid = document.getElementById("featuredGrid");
const featuredSection = document.getElementById("featuredSection");
const productHeading = document.getElementById("productHeading");
const productCount = document.getElementById("productCount");
const filterButtons = document.querySelectorAll(".filter");

const ITEMS_PER_LOAD = 12;
let currentIndex = 0;
let filteredProducts = [];
let selectedFilter = "all";

function categoryOf(product) {
  if (["lighting", "mirror", "desk", "room"].includes(product.category)) return product.category;
  const text = `${product.name} ${product.desc}`;
  if (/조명|램프|스탠드|무드등|전구/.test(text)) return "lighting";
  if (/거울|시계|벽|포스터|사인/.test(text)) return "mirror";
  if (/키보드|마우스|스피커|LP|데스크|체어|피규어/.test(text)) return "desk";
  return "room";
}

function renderFeatured() {
  const collections = [
    { label: "WARM LIGHT", title: "조명 하나로 달라지는 밤", category: "lighting" },
    { label: "WALL MOOD", title: "벽부터 채우는 나만의 취향", category: "mirror" },
    { label: "DESK SETUP", title: "앉고 싶은 책상 만들기", category: "desk" },
    { label: "ROOM POINT", title: "방의 분위기를 바꾸는 한 끗", category: "room" }
  ];
  featuredGrid.innerHTML = "";
  collections.forEach(collection => {
    const product = PRODUCTS.find(item => categoryOf(item) === collection.category);
    if (!product) return;
    const card = document.createElement("a");
    card.className = "featured-card";
    card.href = "#productGrid";
    card.innerHTML = `<img src="${product.img}" loading="lazy" alt="${collection.title}"><div><small>${collection.label}</small>${collection.title}</div>`;
    card.addEventListener("click", () => setFilter(collection.category));
    featuredGrid.appendChild(card);
  });
}

function renderItems() {
  const items = filteredProducts.slice(currentIndex, currentIndex + ITEMS_PER_LOAD);

  items.forEach(p => {
    const card = document.createElement("a");
    card.className = "product-card";
    card.href = p.link;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    card.innerHTML = `
      <div class="product-image">
        <img src="${p.img}" loading="lazy" alt="${p.name}">
      </div>
      <div class="product-text">
        <p>${p.name}</p>
        <span>${p.desc}</span>
        <em>쿠팡에서 아이템 보기 →</em>
      </div>
    `;

    grid.appendChild(card);
  });

  currentIndex += ITEMS_PER_LOAD;
}

const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && currentIndex < filteredProducts.length) {
    renderItems();
  }
});

observer.observe(sentinel);

function setFilter(filter = selectedFilter) {
  selectedFilter = filter;
  const keyword = searchInput.value.trim().toLowerCase();
  filteredProducts = PRODUCTS.filter(product => {
    const matchesCategory = filter === "all" || categoryOf(product) === filter;
    const matchesSearch = !keyword || `${product.name} ${product.desc}`.toLowerCase().includes(keyword);
    return matchesCategory && matchesSearch;
  });
  grid.innerHTML = "";
  currentIndex = 0;
  renderItems();
  productCount.textContent = `${filteredProducts.length} items`;
  productHeading.textContent = filter === "all" ? "모든 아이템" : document.querySelector(`.filter[data-filter="${filter}"]`).textContent;
  featuredSection.hidden = filter !== "all" || Boolean(keyword);
  filterButtons.forEach(button => button.classList.toggle("active", button.dataset.filter === filter));
}

filterButtons.forEach(button => button.addEventListener("click", () => setFilter(button.dataset.filter)));
searchInput.addEventListener("input", () => setFilter());

async function startStore() {
  try {
    const response = await fetch("/content/products.json");
    if (!response.ok) throw new Error("상품 데이터 요청 실패");
    const data = await response.json();
    const managedProducts = Array.isArray(data.products) ? data.products : [];
    PRODUCTS = [...managedProducts, ...PRODUCTS];
  } catch (error) {
    console.warn("관리자 상품을 불러오지 못해 기본 상품만 표시합니다.", error);
  }
  renderFeatured();
  setFilter();
}

startStore();
